<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block t %}PropSec{% endblock %} · PropSec</title><link rel="stylesheet" href="/static/style.css"></head><body>
{% set path = request.url.path %}
<nav><b>PropSec</b>
<a href="/" class="{{'on' if path=='/'}}">Início</a>
<a href="/fila" class="{{'on' if path.startswith('/fila')}}">Fila de aprovação</a>
<a href="/pipeline" class="{{'on' if path.startswith('/pipeline')}}">Pipeline</a>
<a href="/perfis" class="{{'on' if path.startswith('/perfis')}}">Todos os perfis</a>
<a href="/referencias" class="{{'on' if path.startswith('/referencias')}}">Referências</a>
<a href="/seguranca" class="{{'on' if path.startswith('/seguranca')}}">Segurança</a>
<a href="/aprendizado" class="{{'on' if path.startswith('/aprendizado')}}">Aprendizado</a>
<span id="agente" class="st" style="margin-left:auto" title="o que o agente está fazendo agora"></span>
<span class="small mut">v{{versao}}</span>
</nav><main>{% block c %}{% endblock %}</main>
<script>
(function(){
  const el=document.getElementById('agente');
  const txt={parado:'⏸ agente parado',buscando:'🔎 agente buscando perfis',analisando:'👀 analisando',aguardando:'⏳ aguardando intervalo seguro',bloqueado:'■ agente bloqueado'};
  let a={{ agente|tojson }};
  function pinta(){
    let t=txt[a.estado]||a.estado;
    if(a.perfil&&a.estado!=='parado') t+=' @'+a.perfil;
    if(a.estado==='aguardando'&&a.ate){const s=Math.max(0,Math.round((new Date(a.ate)-new Date())/1000));t+=' — '+s+' s';}
    el.textContent=t;
    el.style.color=a.estado==='bloqueado'?'var(--bad)':(a.estado==='parado'?'var(--mut)':'var(--ok)');
  }
  pinta(); setInterval(pinta,1000);
  setInterval(()=>fetch('/api/agente').then(r=>r.json()).then(j=>{a=j;pinta();}).catch(()=>{}),5000);
})();
</script></body></html>
