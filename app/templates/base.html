<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block t %}PropSec{% endblock %} · PropSec</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css"></head><body>
{% set path = request.url.path %}
<div class="app">
<aside class="side">
 <a class="marca" href="/">Prop<span>Sec</span></a>
 <nav class="nav" aria-label="Menu principal">
  <a href="/" class="{{'on' if path=='/'}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Hoje</a>
  <a href="/fila" class="{{'on' if path.startswith('/fila')}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Aprovar{% if menu.fila %}<span class="cont" id="cont-fila">{{menu.fila}}</span>{% endif %}</a>
  <a href="/conversas" class="{{'on' if path.startswith('/conversas')}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 18l-1 3 4-2h9a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v9"/></svg>Conversas{% if menu.conversas %}<span class="cont">{{menu.conversas}}</span>{% endif %}</a>
  <a href="/seguranca" class="{{'on' if path.startswith('/seguranca')}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/></svg>Agente</a>
  <div class="grupo">Consultar</div>
  <a href="/perfis" class="{{'on' if path.startswith('/perfis') or path.startswith('/p/')}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c.7-3.4 3-5 6-5s5.3 1.6 6 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c1.6.6 2.7 2.2 3 5"/></svg>Todos os perfis</a>
  <a href="/referencias" class="{{'on' if path.startswith('/referencias')}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.6 5.5 6 .7-4.4 4.1 1.1 6L12 16.4 6.7 19.3l1.1-6L3.4 9.2l6-.7z"/></svg>Referências</a>
  <a href="/aprendizado" class="{{'on' if path.startswith('/aprendizado')}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resultados</a>
 </nav>
 <div class="rodape">
  <div id="agente" class="agente" title="O que o agente está fazendo agora">
   <div class="linha"><i class="dot"></i><span id="ag-tit">Agente</span></div>
   <div class="det" id="ag-det"></div>
  </div>
  <span class="versao">versão {{versao}}</span>
 </div>
</aside>
<main>{% block c %}{% endblock %}</main>
</div>
<script>
(function(){
  const el=document.getElementById('agente'), tit=document.getElementById('ag-tit'), det=document.getElementById('ag-det');
  const nome={parado:'Agente parado',buscando:'Buscando perfis',analisando:'Analisando perfil',aguardando:'Pausa de segurança',bloqueado:'Agente bloqueado'};
  const classe={buscando:'ativo',analisando:'ativo',aguardando:'esperando',bloqueado:'bloqueado'};
  let a={{ agente|tojson }};
  function pinta(){
    tit.textContent=nome[a.estado]||a.estado;
    let d='';
    if(a.perfil&&!['parado','buscando'].includes(a.estado)) d='@'+a.perfil;
    if(a.estado==='aguardando'&&a.ate){const s=Math.max(0,Math.round((new Date(a.ate)-new Date())/1000));d+=(d?', ':'')+'volta em '+s+' s';}
    if(a.estado==='parado') d='Peça uma sessão no Claude';
    det.textContent=d; el.className='agente '+(classe[a.estado]||'');
  }
  pinta(); setInterval(pinta,1000);
  setInterval(()=>fetch('/api/agente').then(r=>r.json()).then(j=>{a=j;pinta();}).catch(()=>{}),5000);
  document.addEventListener('click',e=>{document.querySelectorAll('details.menu-etapa[open]').forEach(d=>{if(!d.contains(e.target))d.removeAttribute('open');});});
})();
</script>
{% block js %}{% endblock %}
</body></html>
