{% macro score(v) -%}
<span class="score {{ 's-hi' if (v or 0) >= 65 else ('s-mid' if (v or 0) >= 45 else 's-lo') }}">{{ '%.0f'|format(v or 0) }}</span>
{%- endmacro %}
{% macro ig(u) -%}<a href="/p/{{u}}">@{{u}}</a> <a class="small mut" href="https://instagram.com/{{u}}" target="_blank" title="abrir no Instagram">↗</a>{%- endmacro %}
{% macro tags(s) -%}{% if s %}{% for t in s.split(',') %}{% if t.strip() %}<span class="tag">{{t.strip()}}</span>{% endif %}{% endfor %}{% endif %}{%- endmacro %}
